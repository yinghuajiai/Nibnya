# 发布工作流：推 tag 时构建 Debug APK 并自动创建 pre-release
#
# 设计要点：
# - **由工作流自己构建并上传 APK**（不使用本地产物）
# - tag 会同时推到 origin 与 upstream，因此只在**上游**仓库创建 Release，避免出现两份
# - 只发 Debug（测试版），不碰正式版；Release 标记为 pre-release
# - Debug 与 Release 共用同一个正式签名密钥（KEYSTORE_PATH 存在时 build.gradle 两者都走 release 签名）

name: Release Nibnya (pre-release)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（例如 v1.0.4a）'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 版本规则（用户约定）：
      #   tag 不带字母后缀  -> 正式版：assembleRelease + 正式 release（非 prerelease）
      #   tag 带字母后缀    -> 测试版：assembleDebug  + prerelease
      #   例：v1.0.4 正式 / v1.0.4a、v1.0.4b 测试
      - name: Decide build kind
        id: kind
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          BASE="${TAG#v}"
          # 去掉所有数字、点、横线后还剩字母 -> 测试版
          SUFFIX=$(echo "$BASE" | tr -d "0-9.-")
          if [ -z "$SUFFIX" ]; then
            echo "is_stable=true"  >> "$GITHUB_OUTPUT"
            echo "kind=stable"    >> "$GITHUB_OUTPUT"
          else
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
            echo "kind=test"      >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "判定结果: $TAG -> kind=$( [ -z "$SUFFIX" ] && echo stable || echo test )"


      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant gradlew permission
        run: chmod +x gradlew

      # Debug 也用正式密钥：build.gradle 里 debug 块的 signingConfig
      # 在 KEYSTORE_PATH 存在时会选用 signingConfigs.release。
      # 没配 secret 的仓库（比如 fork）不会因此失败，会退回仓库内的 debugmt 签名。
      - name: Decode keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/nibnya.keystore
            echo "Keystore decoded."
          else
            echo "No KEYSTORE_BASE64 secret; the build will fall back to the in-repo debug keystore."
          fi

      - name: Build APK
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f app/nibnya.keystore ]; then
            export KEYSTORE_PATH=nibnya.keystore
            echo "Signing with the official keystore."
          else
            echo "Signing with the fallback debug keystore."
          fi
          if [ "${{ steps.kind.outputs.is_stable }}" = "true" ]; then
            echo "正式版：assembleRelease"
            ./gradlew assembleRelease --console=plain
          else
            echo "测试版：assembleDebug"
            ./gradlew assembleDebug --console=plain
          fi


      - name: Show APK info
        run: |
          if [ "${{ steps.kind.outputs.is_stable }}" = "true" ]; then
            ls -l app/build/outputs/apk/release/
          else
            ls -l app/build/outputs/apk/debug/
          fi


      - name: Rename APK
        id: apk
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [ "${{ steps.kind.outputs.is_stable }}" = "true" ]; then
            SRC=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
            OUT="Nibnya-${TAG}-release.apk"
          else
            SRC=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
            OUT="Nibnya-${TAG}-debug.apk"
          fi
          cp "$SRC" "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          ls -l "$OUT"


      - name: Create release
        if: github.repository == 'yinghuajimew/Nibnya'
        env:
          # ⚠️ 用作者的 PAT 而不是 GITHUB_TOKEN。
          #    GITHUB_TOKEN 创建的 Release，发布者恒显示 github-actions[bot]；
          #    换成 AUTHOR_PAT 后，发布者显示为 PAT 所属账号（yinghuajiai）。
          #    没配这个 secret 的 fork 会退回 GITHUB_TOKEN，不至于失败。
          GH_TOKEN: ${{ secrets.AUTHOR_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.apk.outputs.tag }}"
          IS_STABLE="${{ steps.kind.outputs.is_stable }}"

          # 优先用 release-notes/<tag>.md；没有就退回 release-notes/<tag去掉v>.md；
          # 再没有就只写一行标题，保证工作流不会因为缺文件而失败
          NOTES="release-notes/${TAG}.md"
          [ -f "$NOTES" ] || NOTES="release-notes/${TAG#v}.md"

          # 按版本类型决定标题与 prerelease 标记
          if [ "$IS_STABLE" = "true" ]; then
            TITLE="Nibnya ${TAG} 正式版 / Stable"
            FLAGS="--latest"
          else
            TITLE="Nibnya ${TAG}（测试版 / Test build）"
            FLAGS="--prerelease"
          fi

          # 若同名 Release 已存在（例如重推 tag），先删掉再建，避免 create 失败
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，先删除后重建"
            gh release delete "$TAG" --yes --cleanup-tag=false
          fi

          if [ -f "$NOTES" ]; then
            echo "Using notes file: $NOTES"
            gh release create "$TAG" "${{ steps.apk.outputs.file }}" \
              --title "$TITLE" --notes-file "$NOTES" $FLAGS
          else
            echo "No notes file found, creating release without detailed notes"
            gh release create "$TAG" "${{ steps.apk.outputs.file }}" \
              --title "$TITLE" --notes "Nibnya ${TAG}" $FLAGS
          fi

          # 正式版额外标为 latest（prerelease 加 --latest 会被 GitHub 拒绝）
          if [ "$IS_STABLE" = "true" ]; then
            gh release edit "$TAG" --latest
          fi

      - name: Skipped on fork
        if: github.repository != 'yinghuajimew/Nibnya'
        run: echo "This repository is not the release target (yinghuajimew/Nibnya); build finished, release skipped."
